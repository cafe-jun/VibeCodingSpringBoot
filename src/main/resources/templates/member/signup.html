<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>회원가입</title>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; color: #333; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .signup-container { background: white; padding: 40px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 450px; }
        h1 { font-size: 24px; margin-bottom: 20px; color: #2c3e50; text-align: center; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: 600; }
        input[type="text"], input[type="password"], input[type="email"] { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background-color: #2ecc71; color: white; border: none; border-radius: 4px; cursor: pointer; transition: background-color 0.3s; font-size: 16px; font-weight: bold; margin-top: 10px; }
        button:hover { background-color: #27ae60; }
        .footer-links { margin-top: 20px; text-align: center; font-size: 14px; }
        .footer-links a { color: #3498db; text-decoration: none; }
        .error-message { color: #e74c3c; margin-top: 10px; text-align: center; display: none; }
    </style>
</head>
<body>

<div class="signup-container">
    <h1>회원가입</h1>
    <form id="signupForm">
        <div class="form-group">
            <label for="loginId">아이디</label>
            <input type="text" id="loginId" name="loginId" required placeholder="사용할 아이디를 입력하세요">
        </div>
        <div class="form-group">
            <label for="password">비밀번호</label>
            <input type="password" id="password" name="password" required placeholder="비밀번호를 입력하세요">
        </div>
        <div class="form-group">
            <label for="name">이름</label>
            <input type="text" id="name" name="name" required placeholder="이름을 입력하세요">
        </div>
        <div class="form-group">
            <label for="email">이메일</label>
            <input type="email" id="email" name="email" required placeholder="example@email.com">
        </div>
        <button type="submit">가입하기</button>
    </form>
    <div id="errorMessage" class="error-message"></div>
    <div class="footer-links">
        이미 계정이 있으신가요? <a href="/login">로그인하기</a>
    </div>
</div>

<script>
    document.getElementById('signupForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const loginId = document.getElementById('loginId').value;
        const password = document.getElementById('password').value;
        const name = document.getElementById('name').value;
        const email = document.getElementById('email').value;
        const errorMessage = document.getElementById('errorMessage');
        
        try {
            const response = await fetch('/api/members/signup', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ loginId, password, name, email })
            });
            
            const result = await response.json();
            
            if (response.ok) {
                alert('회원가입이 완료되었습니다! 로그인 페이지로 이동합니다.');
                window.location.href = '/login';
            } else {
                errorMessage.textContent = result.message || '회원가입에 실패했습니다.';
                errorMessage.style.display = 'block';
            }
        } catch (error) {
            console.error('회원가입 에러:', error);
            errorMessage.textContent = '서버와의 통신에 실패했습니다.';
            errorMessage.style.display = 'block';
        }
    });
</script>

</body>
</html>
